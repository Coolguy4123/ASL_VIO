%YAML:1.0 # need to specify the file type at the top!

# OpenVINS settings for episode_2: one camera + IMU, slow ground vehicle (about 0.4 m/s).
# Only the lines that differ from OpenVINS's EuRoC example are commented.

verbosity: "INFO"

use_fej: true
integration: "rk4"
use_stereo: false   # we have one camera
max_cameras: 1      # one camera (mono)

calib_cam_extrinsics: true   # let OpenVINS correct our guessed camera mounting
calib_cam_intrinsics: true   # let OpenVINS correct our estimated focal length and image centre
calib_cam_timeoffset: true   # let OpenVINS correct the camera-IMU time offset
calib_imu_intrinsics: false
calib_imu_g_sensitivity: false

max_clones: 15   # a bit more than the default 11: our camera is slow (5 to 10 Hz) and the vehicle moves slowly
max_slam: 50
max_slam_in_update: 25
max_msckf_in_update: 40
dt_slam_delay: 1

gravity_mag: 9.81

feat_rep_msckf: "GLOBAL_3D"
feat_rep_slam: "ANCHORED_MSCKF_INVERSE_DEPTH"
feat_rep_aruco: "ANCHORED_MSCKF_INVERSE_DEPTH"

# Zero-velocity updates: when the vehicle stands still, tell the filter its speed is zero.
# Our recording has several long stops, so this should help against drift.
try_zupt: true
zupt_chi2_multipler: 0   # 0 = decide only from image movement ("disparity"), not from the IMU
zupt_max_velocity: 0.1
zupt_noise_multiplier: 10
zupt_max_disparity: 0.5
zupt_only_at_beginning: false

# ==================================================================

# Start-up. We begin from a standstill (static init), so use the bags that start with the
# vehicle stopped: seg_b_undist (still for its first ~25 s).
init_window_time: 2.0
init_imu_thresh: 0.3
init_max_disparity: 10.0
init_max_features: 50

init_dyn_use: true   # set true to start while already moving (needs the vehicle to turn at least ~10 degrees)
init_dyn_mle_opt_calib: false
init_dyn_mle_max_iter: 50
init_dyn_mle_max_time: 0.05
init_dyn_mle_max_threads: 4
init_dyn_num_pose: 6
init_dyn_min_deg: 3.0

init_dyn_inflation_ori: 10
init_dyn_inflation_vel: 100
init_dyn_inflation_bg: 10
init_dyn_inflation_ba: 100
init_dyn_min_rec_cond: 1e-12

init_dyn_bias_g: [ 0.0, 0.0, 0.0 ]
init_dyn_bias_a: [ 0.0, 0.0, 0.0 ]

# ==================================================================

record_timing_information: false
record_timing_filepath: "/tmp/traj_timing.txt"

save_total_state: false
filepath_est: "/tmp/ov_estimate.txt"
filepath_std: "/tmp/ov_estimate_std.txt"
filepath_gt: "/tmp/ov_groundtruth.txt"

# ==================================================================

# Picture tracking
use_klt: true
num_pts: 200
fast_threshold: 20
grid_x: 5
grid_y: 5
min_px_dist: 10
knn_ratio: 0.70
track_frequency: 10.0        # our frames arrive at 5 to 10 per second
downsample_cameras: false
num_opencv_threads: 2
histogram_method: "NONE"     # the logger already applied contrast enhancement (CLAHE) to the images

use_aruco: false
num_aruco: 1024
downsize_aruco: true

# ==================================================================

up_msckf_sigma_px: 1.5       # slightly larger than default: our camera numbers are estimates
up_msckf_chi2_multipler: 1
up_slam_sigma_px: 1.5
up_slam_chi2_multipler: 1
up_aruco_sigma_px: 1
up_aruco_chi2_multipler: 1

use_mask: false

relative_config_imu: "kalibr_imu_chain.yaml"
relative_config_imucam: "kalibr_imucam_chain.yaml"
